<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto">
  <defs>
    <!-- Matte Carbon & Cyberpunk Void Gradients -->
    <radialGradient id="carbonVoid" cx="72%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E1A12" />
      <stop offset="45%" stop-color="#080F0B" />
      <stop offset="100%" stop-color="#040705" />
    </radialGradient>

    <!-- Electric Xbox Emerald Glow -->
    <radialGradient id="xboxGlow" cx="74%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#107C10" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#22C55E" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#15803D" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#040705" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#14532D" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#047857" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#107C10" stop-opacity="0.9" />
    </linearGradient>

    <!-- Hexagonal Carbon Weave Pattern -->
    <pattern id="hexGrid" width="24" height="41.56" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 24 6.92 L 24 20.78 L 12 27.7 L 0 20.78 L 0 6.92 Z M 12 41.56 L 24 34.64 L 24 20.78 L 12 27.7 L 0 20.78 L 0 34.64 Z" fill="none" stroke="#15803D" stroke-opacity="0.1" stroke-width="0.8" />
    </pattern>

    <!-- Keyframe Motion Animations -->
    <style>
      @keyframes xboxJewelPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #22C55E); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 26px #4ADE80); }
      }
      @keyframes gimbalRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes thumbstickJitter {
        0% { transform: translate(0, 0); }
        20% { transform: translate(3px, -2px); }
        40% { transform: translate(-2px, 3px); }
        60% { transform: translate(2px, 1px); }
        80% { transform: translate(-1px, -3px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes triggerBarSweep {
        0%, 100% { width: 65px; }
        50% { width: 110px; }
      }
      @keyframes latencyFlash {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      .jewel-orb {
        transform-origin: 740px 145px;
        animation: xboxJewelPulse 3.5s ease-in-out infinite;
      }
      .gimbal-ring-1 {
        transform-origin: 740px 145px;
        animation: gimbalRotate 18s linear infinite;
      }
      .gimbal-ring-2 {
        transform-origin: 740px 145px;
        animation: gimbalRotate 28s reverse linear infinite;
      }
      .stick-active {
        animation: thumbstickJitter 4s ease-in-out infinite;
      }
      .trigger-meter {
        animation: triggerBarSweep 2.2s ease-in-out infinite;
      }
      .latency-hud {
        animation: latencyFlash 1.6s ease-in-out infinite;
      }

      .headline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist Sans", sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
        fill: #F0FDF4;
      }
      .mono-chip {
        font-family: "JetBrains Mono", Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Carbon Chassis Plate -->
  <rect width="960" height="320" rx="24" fill="url(#carbonVoid)" />
  <rect width="960" height="320" rx="24" fill="url(#hexGrid)" />
  <rect width="960" height="320" rx="24" fill="url(#xboxGlow)" />
  
  <!-- Outer Beveled Green Neon Rim -->
  <rect x="2" y="2" width="956" height="316" rx="22" fill="none" stroke="url(#cyberBorder)" stroke-width="1.8" />
  <path d="M 28 6 L 932 6" stroke="#86EFAC" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />

  <!-- ==================== 3D WIREFRAME CONTROLLER & THREE.JS GIMBAL ==================== -->

  <!-- Three.js Spatial Gimbal Rings -->
  <g class="gimbal-ring-1">
    <ellipse cx="740" cy="145" rx="140" ry="60" fill="none" stroke="#22C55E" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.6" />
    <circle cx="880" cy="145" r="3.5" fill="#86EFAC" />
  </g>
  <g class="gimbal-ring-2">
    <ellipse cx="740" cy="145" rx="120" ry="115" fill="none" stroke="#16A34A" stroke-width="0.9" stroke-dasharray="3 6" opacity="0.4" />
    <circle cx="620" cy="145" r="2.5" fill="#4ADE80" />
  </g>

  <!-- Isometric Wireframe Controller Silhouette Shell -->
  <path d="M 640 185 C 625 155 635 110 670 95 C 700 82 780 82 810 95 C 845 110 855 155 840 185 C 825 215 805 225 780 205 C 760 190 720 190 700 205 C 675 225 655 215 640 185 Z" 
        fill="#0A140E" stroke="#22C55E" stroke-width="1.6" stroke-dasharray="12 4" opacity="0.85" />

  <!-- Left Analog Thumbstick with Coordinate Reticle -->
  <g class="stick-active" transform="translate(680, 130)">
    <circle cx="0" cy="0" r="22" fill="#061008" stroke="#16A34A" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="#0F2415" stroke="#4ADE80" stroke-width="1.2" />
    <circle cx="0" cy="0" r="4" fill="#22C55E" />
    <!-- Crosshairs -->
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#86EFAC" stroke-width="0.8" opacity="0.7" />
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#86EFAC" stroke-width="0.8" opacity="0.7" />
    <text x="-20" y="32" fill="#86EFAC" class="mono-chip" font-size="8">LS: +0.72, -0.41</text>
  </g>

  <!-- Right ABXY Diamond Cluster -->
  <g transform="translate(800, 130)">
    <!-- Y -->
    <circle cx="0" cy="-14" r="6" fill="#0C1B10" stroke="#FACC15" stroke-width="1.2" />
    <text x="-2.5" y="-11.5" fill="#FACC15" font-family="sans-serif" font-weight="900" font-size="8">Y</text>
    <!-- B -->
    <circle cx="14" cy="0" r="6" fill="#0C1B10" stroke="#EF4444" stroke-width="1.2" />
    <text x="11.5" y="2.5" fill="#EF4444" font-family="sans-serif" font-weight="900" font-size="8">B</text>
    <!-- A -->
    <circle cx="0" cy="14" r="6" fill="#0C1B10" stroke="#22C55E" stroke-width="1.2" />
    <text x="-2.5" y="16.5" fill="#22C55E" font-family="sans-serif" font-weight="900" font-size="8">A</text>
    <!-- X -->
    <circle cx="-14" cy="0" r="6" fill="#0C1B10" stroke="#38BDF8" stroke-width="1.2" />
    <text x="-16.5" y="2.5" fill="#38BDF8" font-family="sans-serif" font-weight="900" font-size="8">X</text>
  </g>

  <!-- Glowing Central Xbox Nexus Jewel Orb -->
  <g class="jewel-orb">
    <circle cx="740" cy="115" r="16" fill="#0A180E" stroke="#22C55E" stroke-width="2" />
    <!-- Iconic Xbox X Curve Silhouette -->
    <path d="M 732 108 Q 740 115 748 122 M 748 108 Q 740 115 732 122" stroke="#F0FDF4" stroke-width="2.6" stroke-linecap="round" fill="none" />
  </g>

  <!-- Live Hardware Telemetry HUD Card -->
  <g transform="translate(640, 246)" class="mono-chip">
    <rect x="0" y="0" width="280" height="48" rx="10" fill="#061209" stroke="#166534" stroke-width="1" opacity="0.95" />
    
    <!-- Polling Rate & Latency -->
    <circle cx="14" cy="16" r="3.5" fill="#22C55E" class="latency-hud" />
    <text x="24" y="19" fill="#4ADE80" font-size="10" font-weight="700">1000 Hz POLLING · 0.4 ms LATENCY</text>

    <!-- Trigger Force Travel Bar -->
    <text x="14" y="36" fill="#86EFAC" font-size="8.5">RT TRAVEL:</text>
    <rect x="75" y="29" width="120" height="8" rx="4" fill="#14532D" />
    <rect x="75" y="29" width="95" height="8" rx="4" fill="#22C55E" class="trigger-meter" />
    <text x="204" y="36" fill="#F0FDF4" font-size="8.5">92% FORCE</text>
  </g>

  <!-- ==================== LEFT EDITORIAL & IDENTITY BLOCK ==================== -->
  <g transform="translate(52, 54)">
    <rect x="0" y="0" width="250" height="28" rx="14" fill="#0B2312" stroke="#15803D" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4.5" fill="#22C55E" class="latency-hud" />
    <text x="28" y="18" fill="#86EFAC" class="mono-chip" font-size="11" font-weight="700">SPATIAL WEB · HARDWARE LAB</text>

    <text x="0" y="80" class="headline" font-size="44">PROTOTYPE 69 XBOX</text>

    <text x="0" y="122" fill="#BBF7D0" font-size="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      3D Spatial Controller Architecture, Three.js Physics &amp; Cyber Telemetry
    </text>

    <!-- Emerald Power Strip Accent -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="40" height="3" fill="#107C10" rx="1.5" />
      <rect x="44" y="0" width="60" height="3" fill="#22C55E" rx="1.5" />
      <rect x="108" y="0" width="30" height="3" fill="#86EFAC" rx="1.5" />
    </g>

    <!-- Tech Specs Badges -->
    <g transform="translate(0, 182)" class="mono-chip" font-size="10.5">
      <rect x="0" y="0" width="105" height="22" rx="6" fill="#0A180E" stroke="#166534" stroke-width="1" />
      <text x="12" y="15" fill="#4ADE80">THREE.JS 3D</text>

      <rect x="115" y="0" width="135" height="22" rx="6" fill="#0A180E" stroke="#166534" stroke-width="1" />
      <text x="127" y="15" fill="#86EFAC">REACT + VITE</text>

      <rect x="260" y="0" width="135" height="22" rx="6" fill="#0A180E" stroke="#166534" stroke-width="1" />
      <text x="272" y="15" fill="#FACC15">GAMEPAD API</text>
    </g>

    <g transform="translate(0, 230)">
      <text x="0" y="0" fill="#4B6E52" class="mono-chip" font-size="9.5">
        DIU FOUNDRY · SUB-MILLISECOND HARDWARE TELEMETRY &amp; SPATIAL UI
      </text>
    </g>
  </g>
</svg>